apiVersion: apps/v1
kind: Deployment
metadata:
  name: prime-backend-deployment
  namespace: default
  labels:
    app: prime-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: prime-backend
  template:
    metadata:
      labels:
        app: prime-backend
    spec:
      containers:
        - name: backend
          image: primedevelopers/backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: prime-backend-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: prime-backend-service
spec:
  type: ClusterIP
  selector:
    app: prime-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prime-frontend-deployment
  namespace: default
  labels:
    app: prime-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prime-frontend
  template:
    metadata:
      labels:
        app: prime-frontend
    spec:
      containers:
        - name: frontend
          image: primedevelopers/frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: prime-frontend-service
spec:
  type: ClusterIP
  selector:
    app: prime-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
